[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chemo-agent-product-api"
version = "0.1.0"
description = "化疗智能体患者流程、方案表单与受控 Agent 服务"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.30,<1",
  "claude-agent-sdk>=0.1,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/chemo_agent_product"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# SQL remains readable in repositories and schema maintenance commands.
"src/chemo_agent_product/**/repository.py" = ["E501"]
"src/chemo_agent_product/**/*_repository.py" = ["E501"]
"src/chemo_agent_product/entrypoints/migrate.py" = ["E501"]
"src/chemo_agent_product/entrypoints/word_layout.py" = ["E501"]
