<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>化疗智能体 · 医生工作站</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#edf2ef;color:#203c38}header{padding:20px 28px;background:#183f3a;color:white;display:flex;justify-content:space-between;align-items:center}header strong{font-size:22px}main{max-width:1250px;margin:auto;padding:26px}.banner{background:#fff3d6;border:1px solid #dfc98b;border-radius:12px;padding:16px;line-height:1.7}.layout{display:grid;grid-template-columns:340px 1fr;gap:22px;margin-top:22px}.cases{display:grid;gap:10px}.case{background:white;border:1px solid #d6e2dc;border-radius:12px;padding:18px;text-align:left;cursor:pointer;color:#203c38}.case[aria-pressed=true]{border:2px solid #357b6e;background:#e6f1eb}.case strong{display:block;font-size:18px}.case small{display:block;margin-top:7px;line-height:1.5;color:#62736a}.current{background:white;border:1px solid #d6e2dc;padding:26px;border-radius:14px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px}.facts p{padding:12px;background:#f4f7f4;margin:0;border-radius:8px}button.round{margin-top:20px;background:white;border:1px solid #73968b;padding:12px;border-radius:8px;cursor:pointer}#status{padding:15px;background:#f2f7f3;border-radius:10px;line-height:1.6}.steps{line-height:2;color:#546a60}#failure{color:#922b27}@media(max-width:800px){header{align-items:flex-start;flex-direction:column;gap:8px}header strong{font-size:20px}.layout{grid-template-columns:1fr}.cases{grid-template-columns:1fr 1fr}}
</style></head><body><header><strong>肿瘤内科 · 医生工作站</strong><span>李明远 · 主管医师</span></header><main><div class="banner">进入患者后，系统在后台准备方案候选。点击右下角“化疗智能体”查看结果，并核对患者资料、方案依据和给药安排。</div><div class="layout"><aside><div id="cases" class="cases"></div><button id="round" class="round">开始新的就诊记录</button></aside><section class="current"><h2 id="name">正在读取患者…</h2><div id="facts" class="facts"></div><h3>后台准备</h3><p id="status">选择患者后后台准备，点击右下角挂件查看。</p><p id="failure" role="alert"></p><h3>诊疗流程</h3><ol class="steps"><li>选择患者，等待右下角“候选已就绪”，打开工作台。</li><li>查看方案依据，比较候选并选用本次方案。</li><li>核对患者资料、治疗周期、日期和实际剂量，保存修订。</li><li>逐项核对提示，单独确认本次方案。</li><li>进入“院方交付检查”，完成医嘱预校验、导入及结果回查。</li><li>全部医嘱处理成功后归档病历，再查询签名回执。</li></ol></section></div></main><script src="__FRONTEND__/chemo-widget.js"></script><script>
const cases=__PATIENTS__;let active='P261008001',round='';
const widget=window.createChemoWidget({serviceOrigin:'__FRONTEND__',getAccessToken:async payload=>{const r=await fetch('/workstation/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const value=await r.json();if(!r.ok)throw new Error(value.message||'医生身份未取得');return value.access_token;},onError:error=>document.getElementById('failure').textContent=error.message});
const buttons={};for(const[id,p]of Object.entries(cases)){const b=document.createElement('button');b.className='case';b.type='button';b.setAttribute('aria-pressed','false');b.innerHTML='<strong>'+p.name+'</strong><small>'+p.description+'</small>';b.onclick=()=>select(id);document.getElementById('cases').append(b);buttons[id]=b;}
async function select(id){active=id;const p=cases[id];for(const[key,b]of Object.entries(buttons))b.setAttribute('aria-pressed',String(key===id));document.getElementById('name').textContent=p.name+' · '+p.diagnosis;document.getElementById('facts').innerHTML='<p>病理：'+p.pathology+'</p><p>场景：'+p.purpose+'</p><p>身高：'+p.height+' cm</p><p>体重：'+(p.weight===null?'缺失':p.weight+' kg')+'</p>';document.getElementById('failure').textContent='';document.getElementById('status').textContent='已选择'+p.name+'，右下角挂件显示实时准备状态。';await widget.updatePatient({patient_id:id,encounter_id:'IP261008'+id.slice(-3)+round,operator_id:'DR1001',operator_name:'李明远',dept_code:'ONC01',operator_dept_name:'肿瘤内科'});}
document.getElementById('round').onclick=()=>{round='_'+Date.now();select(active);};select(active);
</script></body></html>
